<!doctype html>
<html lang="en" data-mode="ant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Automata</title>
<meta name="description" content="A playground for cellular automata: Life-like rules, elementary rules and Langton's ants. Design your own rules, run them at millions of steps a second, and share them as links.">
<meta name="theme-color" content="#f1f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Crect width='3' height='3' fill='%23121212'/%3E%3Cpath d='M1 0h1v1H1zM2 1h1v1H2zM0 2h3v1H0z' fill='%23f1f1ef'/%3E%3C/svg%3E">
<link rel="preload" href="../fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script>
  // Apply saved preferences before first paint.
  try {
    const get = (k) => JSON.parse(localStorage.getItem('automata.' + k));
    const t = get('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    if (get('toolbar') === false) document.documentElement.classList.add('toolbar-folded');
    if (get('counters') === true) document.documentElement.classList.add('show-counters');
  } catch {}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
</body>
</html>
